# Переходник: еАптека. Простой файл — только продажи, на уровне клиента (без точек).
# Период берём из --period (он в имени файла: продажи_MM.YY).
client: "еАптека"
source: sellout
file_type: excel
sheet: 0
header_row: 0
decimal: "."
thousands: " "

columns:                       # наш канон <- колонка(и) в файле (алиасы под дрейф формата)
  # имя товара как ключ: в новом формате "Наименование", в старом — "Товар"
  sku_code: ["Наименование", "Товар"]
  sku_name: ["Наименование", "Товар"]
  qty:      ["Штуки", "Продажи упаковки"]
  rub:      ["Руб", "Выручка в ценах закупки"]

period:
  mode: from_arg               # передаём --period YYYY-MM
