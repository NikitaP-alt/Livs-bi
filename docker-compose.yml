services:
  db:
    image: postgres:16
    container_name: livs_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      # только localhost — наружу Postgres не торчит (на проде доступ через сеть compose)
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: livs_metabase
    ports:
      # локально доступно на http://localhost:3000; на проде наружу пускает Caddy (см. docker-compose.prod.yml)
      - "127.0.0.1:3000:3000"
    volumes:
      # ПЕРСИСТЕНТНОСТЬ дашбордов: встроенная H2-база Metabase (metabase.db.mv.db) на хосте,
      # а не только в контейнере. Дефолтный путь Metabase внутри = /metabase.db/metabase.db.mv.db.
      # Так дашборды переживают пересоздание контейнера и переносятся вместе с проектом.
      - ./metabase-data:/metabase.db
    depends_on:
      db:
        condition: service_healthy
    # Для прод-VM позже вынесем app-БД Metabase в отдельную Postgres-схему.

  app:
    build: .
    container_name: livs_app
    env_file: .env
    environment:
      # внутри сети compose host БД = "db"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
    command: ["sleep", "infinity"]

  ui:
    build: .
    container_name: livs_ui
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
    command: ["streamlit", "run", "app/ui.py", "--server.port", "8501",
              "--server.address", "0.0.0.0", "--server.headless", "true"]
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  pgdata:
